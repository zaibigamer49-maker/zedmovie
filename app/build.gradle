}

android {
    namespace 'com.zobaer53.zedmovies'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.zaibox53.zaibmovies"
        minSdk 26
        targetSdk 37
        versionCode project.hasProperty("appVersionCode") ? project.property("appVersionCode").toInteger() : 1
        versionName project.findProperty("appVersionName") ?: "1.0.0"
        if (project.hasProperty("appIdSuffix")) applicationIdSuffix project.property("appIdSuffix")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        // Works both locally and on GitHub Cloud Build
        def apiKey = "3685ffab821cc668b420c0f71cc4e124"
        def localPropsFile = project.rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            Properties properties = new Properties()
            properties.load(localPropsFile.newDataInputStream())
            if (properties.getProperty("API_KEY") != null) {
                apiKey = properties.getProperty("API_KEY")
            }
        }
        buildConfigField "String", "API_KEY", "\"${apiKey}\""
    }

    signingConfigs {
        release {
            def localPropsFile = project.rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                Properties signing = new Properties()
                signing.load(localPropsFile.newDataInputStream())
                if (signing.getProperty("RELEASE_STORE_FILE") != null) {
                    storeFile file(signing.getProperty("RELEASE_STORE_FILE"))
                    storePassword signing.getProperty("RELEASE_STORE_PASSWORD")
                    keyAlias signing.getProperty("RELEASE_KEY_ALIAS")
                    keyPassword signing.getProperty("RELEASE_KEY_PASSWORD")
                }
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            optimization {
                enable = true
            }
            proguardFiles 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

