name: Build zeDMovies APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix Manifest and Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:name=".zedMoviesApplication"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/zed_movies_round"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/zed_movies_round"
                  android:enableOnBackInvokedCallback="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.zedMovies.Splash"
                  tools:replace="android:allowBackup,android:label,android:theme"
                  tools:targetApi="tiramisu">

                  <meta-data
                      android:name="com.startapp.sdk.APPLICATION_ID"
                      android:value="156899168" />

                  <profileable
                      android:shell="true"
                      tools:targetApi="29" />

                  <activity
                      android:name=".ui.webview.WebViewActivity"
                      android:exported="false"
                      android:theme="@style/Theme.NoActionbar.FullScreen.zedMovies"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard"
                      android:windowSoftInputMode="adjustPan" />
                  <activity
                      android:name=".ui.trailer.TrailerActivity"
                      android:exported="false"
                      android:theme="@style/Theme.zedMovies.Trailer"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard" />
                  <activity
                      android:name=".zedMoviesActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeDMovies-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
