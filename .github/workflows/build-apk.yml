name: Build zeDMovies APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          git checkout -- app/src/main/AndroidManifest.xml || true
          sed -i 's|<application|<application xmlns:tools="http://android.com" tools:replace="android:allowBackup,android:label,android:theme,android:supportsRtl"|g' app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="156899168" /></application>|g' app/src/main/AndroidManifest.xml
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeDMovies-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
